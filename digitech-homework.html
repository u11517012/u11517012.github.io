<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數位科技概論作業 | 個人作品集</title>
    <style>
        :root {
            --bg: #F7F4EF;
            --card: #EFECE6;
            --text: #4A453F;
            --muted: #8C857B;
            --line: #D9D2C7;
            --highlight: #17596E;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.8;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 680px;
            width: 100%;
        }
        nav {
            margin-bottom: 30px;
        }
        .back-btn {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }
        .back-btn:hover {
            color: var(--highlight);
        }
        header {
            margin-bottom: 40px;
            border-bottom: 1px solid var(--line);
            padding-bottom: 20px;
        }
        
        /* 動態打字機效果 */
        .typewriter-text {
            display: inline-block;
            overflow: hidden;
            border-right: 2px solid var(--highlight);
            white-space: nowrap;
            letter-spacing: 1px;
            font-size: 1.8rem;
            font-weight: bold;
            margin: 0 0 8px 0;
            animation: typing 2.5s steps(15, end), blink-caret 0.75s step-end infinite;
        }

        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes blink-caret {
            from, to { border-color: transparent; }
            50% { border-color: var(--highlight); }
        }

        p.subtitle {
            color: var(--muted);
            margin: 0;
            font-size: 0.95rem;
        }
        section {
            margin-bottom: 30px;
        }
        h2 {
            font-size: 1.1rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }
        
        /* 卡片樣式與 Hover 動畫 */
        .box {
            background-color: var(--card);
            padding: 24px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid transparent;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .box h3 {
            margin-top: 0;
            font-size: 1.1rem;
            transition: color 0.3s ease;
        }
        .card-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .box:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(74, 69, 63, 0.08);
            border-color: var(--line);
        }
        .card-link:hover .box h3 {
            color: var(--highlight);
        }

        /* 標籤微互動 */
        .card-tag {
            display: inline-block;
            font-size: 0.8rem;
            color: var(--muted);
            border: 1px solid var(--line);
            padding: 4px 10px;
            border-radius: 4px;
            margin-top: 8px;
            transition: all 0.25s ease;
            background-color: transparent;
        }
        .card-tag:hover {
            color: var(--bg);
            background-color: var(--highlight);
            border-color: var(--highlight);
            transform: scale(1.02);
        }

        /* 頁尾樣式與計時小工具 */
        footer {
            text-align: center;
            color: var(--muted);
            font-size: 0.85rem;
            margin-top: 60px;
        }
        .time-badge {
            display: inline-block;
            margin-top: 10px;
            background-color: var(--card);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px dashed var(--line);
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
        }
        .time-badge:hover {
            background-color: #e2ddd3;
            transform: scale(1.05);
        }
        .highlight-num {
            color: var(--highlight);
            font-weight: bold;
        }
    </style>
</head>
<body>

<!-- 頁尾功能腳本 -->
<script>
    let seconds = 0;
    const timerElement = document.getElementById('timer');

    // 每一秒更新一次時間
    setInterval(() => {
        seconds++;
        if (seconds < 60) {
            timerElement.textContent = `${seconds} 秒`;
        } else {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            timerElement.textContent = `${mins} 分 ${secs} 秒`;
        }
    }, 1000);

    // 點擊計時器跳出趣味對話框
    function showEasterEgg() {
        const quotes = [
            "感謝你的認真觀看！給個高分吧 🥹",
            "別算時間了，作業真的很用心做喔！✨",
            "恭喜發現隱藏彩蛋！祝你有美好的一天 🎉"
        ];
        const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
        alert(randomQuote);
    }
</script>
